<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon – PresentoLab</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      animation: fadeIn 1.5s ease-out;
    }

    img.logo {
      width: 120px;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
      color: #dddddd;
      line-height: 1.6;
    }

    .social-icons a {
      margin: 0 10px;
      font-size: 1.4rem;
      color: #ffffff;
      transition: 0.3s ease;
    }

    .social-icons a:hover {
      color: #ffdd57;
      transform: scale(1.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Logo (replace src value with your logo file path) -->
    <img src="logo.png" alt="PresentoLab Logo" class="logo">

    <h1>Something Amazing is Coming Soon</h1>
    <p>We're building a fresh digital home for PresentoLab — a hub for standout presentations, pitch decks, and visual storytelling. Stay tuned!</p>

    <div class="social-icons">
      <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>
  </div>
</body>
</html>
